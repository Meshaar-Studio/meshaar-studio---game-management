<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Meshaar Studio | إدارة تطوير الألعاب</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f2f4f9;--cd:#fff;--tx:#14213d;--mu:#69708a;--bd:#dde1ec;--ac:#14213d;--on:#fff;--gd:#e9b949;--ok:#2e7d4f;--wr:#b7791f;--er:#c0392b;--tr:#e3e7f1;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1424;--cd:#172038;--tx:#eef1fa;--mu:#9aa3bf;--bd:#27314f;--ac:#e9b949;--on:#14213d;--ok:#5fc08a;--wr:#e0b055;--er:#ef7b6e;--tr:#27314f}}
:root[data-theme="dark"]{--bg:#0e1424;--cd:#172038;--tx:#eef1fa;--mu:#9aa3bf;--bd:#27314f;--ac:#e9b949;--on:#14213d;--ok:#5fc08a;--wr:#e0b055;--er:#ef7b6e;--tr:#27314f}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.7 'IBM Plex Sans Arabic',Tahoma,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
.logo{background:#fff;border-radius:10px;padding:3px 8px;height:44px;display:block}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--cd);border-bottom:1px solid var(--bd);padding:8px 14px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
header .u{margin-inline-start:auto;font-size:13px;color:var(--mu)}
nav{display:flex;gap:4px;overflow-x:auto;padding:8px 14px;background:var(--cd);border-bottom:1px solid var(--bd)}
nav button{white-space:nowrap;border:0;background:none;padding:6px 14px;border-radius:99px;cursor:pointer;color:var(--mu);font-weight:600}
nav button.on{background:var(--ac);color:var(--on)}
main{max-width:1000px;margin:0 auto;padding:16px 14px 40px}
h2{margin:0 0 12px;font-size:21px}h3{margin:0 0 8px;font-size:16px}
.g{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin-bottom:16px}
.c{background:var(--cd);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:14px}
.g .c{margin:0}.n{font-size:28px;font-weight:700}.mu{color:var(--mu);font-size:13px}
.w{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:560px}
th,td{padding:9px 8px;text-align:start;border-bottom:1px solid var(--bd);font-size:14px;vertical-align:middle}th{color:var(--mu);font-weight:600}
.bar{height:8px;background:var(--tr);border-radius:9px;overflow:hidden;min-width:70px}.bar i{display:block;height:100%;background:var(--ac);border-radius:9px}
.bd{display:inline-block;padding:1px 10px;border-radius:99px;font-size:12px;font-weight:600;border:1px solid currentColor}
.Completed{color:var(--ok)}.inprogress{color:var(--wr)}.todo{color:var(--mu)}.High{color:var(--er)}.Medium{color:var(--wr)}.Low{color:var(--ok)}
.b{border:0;background:var(--ac);color:var(--on);padding:7px 16px;border-radius:9px;cursor:pointer;font-weight:600}
.b.s{background:none;color:var(--tx);border:1px solid var(--bd);padding:3px 11px;font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
input,select,textarea{background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:7px 10px;width:100%}.row select{width:auto}
label{display:block;margin-bottom:10px;font-size:13px;color:var(--mu)}
dialog{background:var(--cd);color:var(--tx);border:1px solid var(--bd);border-radius:14px;width:min(420px,92vw);padding:18px}dialog::backdrop{background:#0008}
.lg{min-height:80vh;display:grid;place-items:center;padding:16px}.lg .c{width:min(380px,100%);text-align:center}
.lg .logo{height:90px;margin:0 auto 12px}
.gd{height:3px;width:46px;background:var(--gd);margin:8px auto 16px;border-radius:3px}
.cd{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.rw{display:grid;grid-template-columns:110px 1fr 54px;gap:8px;align-items:center;margin-bottom:8px;font-size:13px}
.cg{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}.cg .c{margin:0}.dn{display:flex;gap:16px;align-items:center;flex-wrap:wrap;font-size:14px}.dt{display:inline-block;width:10px;height:10px;border-radius:50%;margin-inline-end:6px}
@media print{header,nav,.np{display:none}}
</style></head><body><div id="app"></div><dialog id="dl"></dialog>

const ST={'to do':'قيد الانتظار','in progress':'جارٍ','Completed':'مكتمل'},PR={High:'عالية',Medium:'متوسطة',Low:'منخفضة'},RL={Manager:'مدير',Programmer:'مبرمج',Designer:'مصمم',Analyst:'محلل'};
let me=null,view='dash',fs='all';
let lang='ar';try{lang=localStorage.getItem('lg')||'ar'}catch(x){}
const DS=[["كلمة المرور التجريبية: الاسم الأول@رقم الموظف (مثال: Omar@2)", "Demo password: FirstName@EmployeeID (e.g. Omar@2)"], ["اختر حسابك للدخول (نسخة تجريبية)", "Choose an account to sign in (demo)"], ["نظام إدارة تطوير الألعاب", "Game Development Management System"], ["كلمة المرور غير صحيحة", "Wrong password"], ["تطور الإنجاز مع الوقت", "Progress over time"], ["نسبة الإنجاز (0-100)", "Progress (0-100)"], ["مشاريع اقترب موعدها", "Projects near deadline"], ["عبء العمل لكل موظف", "Workload per employee"], ["توزيع حالة المهام", "Task status distribution"], ["إجمالي الميزانية", "Total budget"], ["ميزانية المشاريع", "Project budgets"], ["عبّئ كل الحقول", "Please fill in all fields"], ["متوسط الإنجاز", "Avg. progress"], ["تقدم المشاريع", "Project progress"], ["سجل التحديثات", "Update log"], ["طباعة التقرير", "Print report"], ["تاريخ البداية", "Start date"], ["قيد الانتظار", "To do"], ["موعد التسليم", "Deadline"], ["لوحة التحكم", "Dashboard"], ["حالة المهام", "Task status"], ["كلمة المرور", "Password"], ["مشروع جديد", "New project"], ["كل الحالات", "All statuses"], ["مهمة جديدة", "New task"], ["اسم اللعبة", "Game name"], ["اسم المهمة", "Task name"], ["التحديثات", "Updates"], ["الميزانية", "Budget"], ["المستخدم", "User"], ["المشاريع", "Projects"], ["الموظفون", "Employees"], ["التقارير", "Reports"], ["الأولوية", "Priority"], ["الإنجاز", "Progress"], ["البداية", "Start"], ["التسليم", "Deadline"], ["المشروع", "Project"], ["المسؤول", "Assignee"], ["تحديث: ", "Update: "], ["التاريخ", "Date"], ["ملاحظات", "Notes"], ["المهام", "Tasks"], ["متوسطة", "Medium"], ["منخفضة", "Low"], ["مشاريع", "Projects"], ["اللعبة", "Game"], ["المهمة", "Task"], ["الحالة", "Status"], ["الموظف", "Employee"], ["النسبة", "%"], ["مبرمج", "Programmer"], ["مكتمل", "Completed"], ["عالية", "High"], ["تحديث", "Update"], ["إلغاء", "Cancel"], ["دخول", "Sign in"], ["خروج", "Sign out"], ["مدير", "Manager"], ["مصمم", "Designer"], ["محلل", "Analyst"], ["جارٍ", "In progress"], ["مهام", "Tasks"], ["حفظ", "Save"]],RX=[["مهام \\((\\d+) مكتملة\\)", "Tasks ($1 completed)"], ["(\\d+) مهام، (\\d+) مكتملة", "$1 tasks, $2 completed"], ["متأخر (\\d+) يوم", "$1 days overdue"], ["باقي (\\d+) يوم", "$1 days left"]].map(([a,b])=>[new RegExp(a,'g'),b]);
const L=t=>{if(lang=='ar')return t;RX.forEach(([r,v])=>t=t.replace(r,v));DS.forEach(([a,b])=>t=t.split(a).join(b));return t};
function tg(){lang=lang=='ar'?'en':'ar';try{localStorage.setItem('lg',lang)}catch(x){}draw()}
const TB=()=>`<button class="b s" onclick="tg()">${lang=='ar'?'EN':'عربي'}</button>`;
const pj=id=>P.find(x=>x.id==id)||{name:'-'},em=id=>E.find(x=>x.id==id)||{name:'-'},tk=id=>T.find(x=>x.id==id)||{name:'-'};
const mgr=()=>me&&me.role==='Manager';
const pp=id=>{const t=T.filter(x=>x.pid==id);return t.length?Math.round(t.reduce((a,x)=>a+x.pg,0)/t.length):0};
const bar=v=>`<div class="bar"><i style="width:${v}%"></i></div>`;
const sc=s=>s.replace(' ',''),sb=s=>`<span class="bd ${sc(s)}">${ST[s]}</span>`;
const days=d=>Math.ceil((new Date(d)-new Date(new Date().toDateString()))/864e5);
const tbl=(h,r)=>`<div class="w"><table><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr>${r.map(x=>`<tr>${x.map(y=>`<td>${y}</td>`).join('')}</tr>`).join('')}</table></div>`;
const PW={1:'Mohammed@1',2:'Omar@2',3:'Osama@3',4:'Ahmed@4',5:'Majed@5',6:'Bassam@6'};
function lgn(){const u=em(+$('#lu').value);if($('#lp').value===PW[u.id]){me=u;view='dash';draw()}else $('#er').textContent=L('كلمة المرور غير صحيحة')}
const CL=['#3b6fd4','#e9b949','#2e9d6a','#d9604f','#8a63d2'],sp=x=>x.name.replace(/_game/i,'');
function donut(a,c){const tot=a.reduce((s,x)=>s+x[1],0)||1,r=48,C=2*Math.PI*r;let o=0;
 const arcs=a.map(x=>{const l=x[1]/tot*C,t=`<circle cx="60" cy="60" r="${r}" fill="none" stroke="${x[2]}" stroke-width="16" stroke-dasharray="${l} ${C-l}" stroke-dashoffset="${-o}" transform="rotate(-90 60 60)"/>`;o+=l;return t}).join('');
 return `<div class="dn"><svg viewBox="0 0 120 120" width="150" height="150" style="direction:ltr">${arcs}<text x="60" y="60" text-anchor="middle" font-size="24" font-weight="700" fill="currentColor">${c[0]}</text><text x="60" y="76" text-anchor="middle" font-size="10" fill="var(--mu)">${c[1]}</text></svg><div>${a.map(x=>`<div><i class="dt" style="background:${x[2]}"></i>${x[0]} <b>${x[1]}</b></div>`).join('')}</div></div>`}
function cols(a,u=''){const mx=Math.max(...a.map(x=>x[1]),1),W=60*a.length+20;
 return `<svg viewBox="0 0 ${W} 180" style="direction:ltr;width:100%;max-width:${Math.max(W*1.8,360)}px">${[0,.5,1].map(f=>`<line x1="10" x2="${W-10}" y1="${150-f*120}" y2="${150-f*120}" stroke="var(--bd)"/>`).join('')}${a.map((x,i)=>{const h=x[1]/mx*120,cx=30+i*60;return `<rect x="${cx-16}" y="${150-h}" width="32" height="${h}" rx="5" fill="${CL[i%5]}"/><text x="${cx}" y="${144-h}" text-anchor="middle" font-size="11" fill="currentColor">${x[1]}${u}</text><text x="${cx}" y="167" text-anchor="middle" font-size="10" fill="var(--mu)">${e(x[0].slice(0,9))}</text>`}).join('')}</svg>`}
function line(){const a=[...U].sort((x,y)=>x.d<y.d?-1:1),W=320,py=v=>140-v*1.2,px=i=>30+i*(W-50)/Math.max(a.length-1,1);
 return `<svg viewBox="0 0 ${W} 170" style="direction:ltr;width:100%;max-width:560px">${[0,50,100].map(v=>`<line x1="30" x2="${W-10}" y1="${py(v)}" y2="${py(v)}" stroke="var(--bd)"/><text x="24" y="${py(v)+3}" text-anchor="end" font-size="9" fill="var(--mu)">${v}%</text>`).join('')}<polyline fill="none" stroke="#3b6fd4" stroke-width="2.5" points="${a.map((x,i)=>px(i)+','+py(x.p)).join(' ')}"/>${a.map((x,i)=>`<circle cx="${px(i)}" cy="${py(x.p)}" r="4.5" fill="#e9b949"/><text x="${px(i)}" y="158" text-anchor="middle" font-size="9" fill="var(--mu)">${x.d.slice(5)}</text>`).join('')}</svg>`}
const stD=()=>donut(Object.keys(ST).map((k,i)=>[ST[k],T.filter(x=>x.st==k).length,['#9aa3bf','#e9b949','#2e9d6a'][i]]),[T.length,'مهام']);
function go(v){view=v;draw()}
function draw(){document.documentElement.lang=lang;document.documentElement.dir=lang=='ar'?'rtl':'ltr';document.title=lang=='ar'?'Meshaar Studio | إدارة تطوير الألعاب':'Meshaar Studio | Game Development Management';
 if(!me){$('#app').innerHTML=L(`<div class="lg"><div class="c"><img class="logo" src="${LOGO}" alt="Meshaar Studio"><div class="gd"></div><h3>نظام إدارة تطوير الألعاب</h3><p class="mu">اختر حسابك للدخول (نسخة تجريبية)</p><label>المستخدم<select id="lu">${E.map(x=>`<option value="${x.id}">${e(x.name)} - ${RL[x.role]}</option>`).join('')}</select></label><label>كلمة المرور<input id="lp" type="password" autocomplete="off" onkeydown="if(event.key=='Enter')lgn()"></label><div id="er" style="color:var(--er);min-height:24px;font-size:13px"></div><button class="b" style="width:100%" onclick="lgn()">دخول</button> ${TB()}<p class="mu" style="margin:12px 0 0">كلمة المرور التجريبية: الاسم الأول@رقم الموظف (مثال: Omar@2)</p></div></div>`);return}
 const N=[['dash','لوحة التحكم'],['proj','المشاريع'],['task','المهام'],['emp','الموظفون'],['upd','التحديثات'],['rep','التقارير']];
 const V={dash,proj,task,emp,upd,rep}[view]();
 $('#app').innerHTML=L(`<header><img class="logo" src="${LOGO}" alt="Meshaar Studio"><span class="u">${e(me.name)} (${RL[me.role]}) <button class="b s" onclick="me=null;draw()">خروج</button> ${TB()}</span></header><nav>${N.map(n=>`<button class="${view==n[0]?'on':''}" onclick="go('${n[0]}')">${n[1]}</button>`).join('')}</nav><main>${V}</main>`)}
function dash(){
 const done=T.filter(x=>x.st=='Completed').length,avg=Math.round(T.reduce((a,x)=>a+x.pg,0)/T.length),late=P.filter(x=>days(x.d)<=3&&pp(x.id)<100);
 return `<h2>لوحة التحكم</h2><div class="g"><div class="c"><div class="n">${P.length}</div><div class="mu">مشاريع</div></div><div class="c"><div class="n">${T.length}</div><div class="mu">مهام (${done} مكتملة)</div></div><div class="c"><div class="n">${avg}%</div><div class="mu">متوسط الإنجاز</div></div><div class="c"><div class="n">${P.reduce((a,x)=>a+x.b,0).toLocaleString('en')}</div><div class="mu">إجمالي الميزانية</div></div></div>
 ${late.length?`<div class="c"><h3>مشاريع اقترب موعدها</h3>${late.map(x=>`<div>${e(x.name)} - ${days(x.d)<0?'متأخر '+(-days(x.d))+' يوم':'باقي '+days(x.d)+' يوم'} - الإنجاز ${pp(x.id)}%</div>`).join('')}</div>`:''}
 <div class="cg"><div class="c"><h3>توزيع حالة المهام</h3>${stD()}</div><div class="c"><h3>تقدم المشاريع</h3>${cols(P.map(x=>[sp(x),pp(x.id)]),'%')}</div></div>`}
function proj(){
 return `<h2>المشاريع</h2>${mgr()?'<div class="row"><button class="b" onclick="addP()">+ مشروع جديد</button></div>':''}<div class="c">${tbl(['#','اللعبة','البداية','التسليم','الأولوية','الميزانية','الإنجاز'],P.map(x=>[x.id,e(x.name),x.s,x.d,`<span class="bd ${x.pr}">${PR[x.pr]}</span>`,x.b.toLocaleString('en'),bar(pp(x.id))+pp(x.id)+'%']))}</div>`}
function task(){
 const L=T.filter(x=>fs=='all'||x.st==fs);
 return `<h2>المهام</h2><div class="row"><select onchange="fs=this.value;draw()"><option value="all">كل الحالات</option>${Object.keys(ST).map(k=>`<option value="${k}" ${fs==k?'selected':''}>${ST[k]}</option>`).join('')}</select>${mgr()?'<button class="b" onclick="addT()">+ مهمة جديدة</button>':''}</div><div class="c">${tbl(['#','المهمة','المشروع','المسؤول','الحالة','الإنجاز',''],L.map(x=>[x.id,e(x.name),e(pj(x.pid).name),e(em(x.to).name),sb(x.st),bar(x.pg)+x.pg+'%',(mgr()||x.to==me.id)?`<button class="b s" onclick="updT(${x.id})">تحديث</button>`:'']))}</div>`}
function emp(){
 return `<h2>الموظفون</h2><div class="cd">${E.map(x=>{const t=T.filter(y=>y.to==x.id);return `<div class="c" style="margin:0"><h3>${e(x.name)}</h3><div class="mu">${RL[x.role]} · ${e(x.em)}</div><p style="margin:8px 0 0">${t.length} مهام، ${t.filter(y=>y.st=='Completed').length} مكتملة</p></div>`}).join('')}</div>`}
function upd(){
 return `<h2>سجل التحديثات</h2><div class="c">${tbl(['#','المهمة','الموظف','التاريخ','النسبة','ملاحظات'],[...U].reverse().map(x=>[x.id,e(tk(x.tid).name),e(em(x.eid).name),x.d,x.p+'%',e(x.n)]))}</div>`}
function rep(){return `<h2>التقارير</h2><div class="row np"><button class="b" onclick="print()">طباعة التقرير</button></div><div class="cg"><div class="c"><h3>توزيع حالة المهام</h3>${stD()}</div><div class="c"><h3>تقدم المشاريع</h3>${cols(P.map(x=>[sp(x),pp(x.id)]),'%')}</div><div class="c"><h3>ميزانية المشاريع</h3>${cols(P.map(x=>[sp(x),x.b]))}</div><div class="c"><h3>عبء العمل لكل موظف</h3>${cols(E.map(x=>[x.name.split(' ')[0],T.filter(y=>y.to==x.id).length]))}</div></div><div class="c" style="margin-top:14px"><h3>تطور الإنجاز مع الوقت</h3>${line()}</div>`}
function dlg(t,f,ok){
 $('#dl').innerHTML=L(`<h3>${t}</h3>${f.map(([k,l,ty,o])=>`<label>${l}${ty=='select'?`<select id="f_${k}">${o.map(([v,n])=>`<option value="${v}">${e(n)}</option>`).join('')}</select>`:`<input id="f_${k}" type="${ty}" ${ty=='number'?'min="0"':''}>`}</label>`).join('')}<div class="row"><button class="b" id="sv">حفظ</button><button class="b s" onclick="$('#dl').close()">إلغاء</button></div>`);
 $('#sv').onclick=()=>{const v={};f.forEach(([k])=>v[k]=$('#f_'+k).value);if(f.some(([k])=>!v[k])){alert(L('عبّئ كل الحقول'));return}ok(v);$('#dl').close();draw()};$('#dl').showModal()}
function addP(){dlg('مشروع جديد',[['n','اسم اللعبة','text'],['s','تاريخ البداية','date'],['d','موعد التسليم','date'],['p','الأولوية','select',Object.keys(PR).map(k=>[k,PR[k]])],['b','الميزانية','number']],v=>P.push({id:Math.max(...P.map(x=>x.id))+1,name:v.n,s:v.s,d:v.d,pr:v.p,b:+v.b}))}
function addT(){dlg('مهمة جديدة',[['n','اسم المهمة','text'],['p','المشروع','select',P.map(x=>[x.id,x.name])],['t','المسؤول','select',E.map(x=>[x.id,x.name])]],v=>T.push({id:Math.max(...T.map(x=>x.id))+1,pid:+v.p,to:+v.t,name:v.n,st:'to do',pg:0}))}
function updT(id){const t=tk(id);dlg('تحديث: '+t.name,[['p','نسبة الإنجاز (0-100)','number'],['n','ملاحظات','text']],v=>{const p=Math.min(100,+v.p);t.pg=p;t.st=p>=100?'Completed':p>0?'in progress':'to do';U.push({id:U.length+1,tid:id,eid:me.id,d:new Date().toISOString().slice(0,10),p,n:v.n})})}
draw();
</script></body></html>
